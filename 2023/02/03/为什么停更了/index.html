<p>最直接的原因就是NOIP考太烂了，今年基本没机会冲省队了。</p>
<p>再一个原因就是懒。</p>
<p>人的惰性是大于一切的。</p>
<p>最近也没做什么题。比较有意思的应该算是奶牛站的和POI的。</p>
<p>新的一年，希望能够多和陌生人说说话，少一点发癫。</p>
<p>春季测试和省选马上就要来临，博客更新的频率可能变快，至少的吧欠的补下来。<strong>即使没有人看。</strong></p></div><nav class="article-next" aria-label="相邻文章"><a href="/2022/11/05/CSP2022%E6%B8%B8%E8%AE%B0/"><span>← 较早一篇</span><strong>CSP2022游记</strong></a><a href="/blog/%E6%A3%80%E8%AE%A8/"><span>较新一篇 →</span><strong>检讨</strong></a></nav></article></div></main><footer class="site-footer shell"><span>© 2026 wgyhm</span><div><a href="/archives/">归档</a><a href="/tags/">标签</a><a href="https://github.com/wgyhm">GitHub ↗</a></div></footer><script type="module">document.querySelector(`.theme-toggle`)?.addEventListener(`click`,()=>{let e=document.documentElement,t=e.dataset.theme===`dark`||!e.dataset.theme&&matchMedia(`(prefers-color-scheme: dark)`).matches;e.dataset.theme=t?`light`:`dark`;try{localStorage.setItem(`wgyhm-theme`,e.dataset.theme)}catch{}});</script></body></html>
